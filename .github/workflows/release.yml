name: Build & Release
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = python installer/make_version_info.py
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like "refs/tags/v*" -and "v$v" -ne $env:GITHUB_REF_NAME) { throw "Le tag ne correspond pas à version.py ($v)" }
      - run: python -m PyInstaller --noconfirm overload.spec
      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=${{ steps.v.outputs.version }}" installer\overload.iss
      - name: Version portable + empreintes SHA-256
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          Compress-Archive -Path dist\OverLoad\* -DestinationPath "dist\OverLoad-$v-portable.zip"
          Get-ChildItem dist\*.exe, dist\*.zip | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OverLoad-Windows-${{ steps.v.outputs.version }}
          path: |
            dist/OverLoad-Setup-*.exe
            dist/OverLoad-*-portable.zip
            dist/SHA256SUMS.txt
      - name: Publier la release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            dist/OverLoad-Setup-*.exe
            dist/OverLoad-*-portable.zip
            dist/SHA256SUMS.txt
